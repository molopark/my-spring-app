services:
  spring-app:
    build: .
    container_name: my-spring-app
    ports:
      - "8080:8080"
    depends_on:
      - db-service

  db-service:
    image: postgres:15
    container_name: postgres-db
    environment:
      - POSTGRES_DB=springdb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    volumes:
      - ./springdb_data:/var/lib/postgresql/data
volumes:
  springdb_data:

